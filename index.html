<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Quieres ser mi San Valentín? 💘</title>

  <style>
    :root{
      --bg:#ffe3ee;
      --card:rgba(255,255,255,.75);
      --text:#2c2c2c;
      --yes:#ff4d8d;
      --shadow:0 20px 60px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:radial-gradient(circle at 20% 10%,#fff0f6 0%,var(--bg) 40%,#ffd0e2 100%);
      color:var(--text);
      overflow:hidden;
    }

    /* Corazones */
    .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
    .heart{
      position:absolute;bottom:-40px;font-size:20px;opacity:.75;
      animation:floatUp linear infinite;
      filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));
    }
    @keyframes floatUp{
      from{transform:translateY(0) translateX(0) rotate(0);opacity:0}
      10%{opacity:.85}
      to{transform:translateY(-115vh) translateX(var(--drift,0px)) rotate(25deg);opacity:0}
    }

    /* Centro */
    .wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{
      width:min(760px,92vw);
      background:var(--card);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.6);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:22px 18px 18px;
      text-align:center;
      position:relative;
    }
    h1{margin:10px 0 14px;font-size:clamp(24px,4vw,38px);line-height:1.15;letter-spacing:-.02em}
    .subtitle{margin:0 0 14px;opacity:.85;font-size:14px}

    /* Fotos */
    .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px auto 18px}
    .photos img{
      width:100%;height:180px;object-fit:cover;border-radius:18px;
      border:2px solid rgba(255,255,255,.7);
      box-shadow:0 12px 25px rgba(0,0,0,.12);
      transition:transform .25s ease;
    }
    .photos img:hover{transform:scale(1.02)}
    @media (max-width:640px){
      .photos{grid-template-columns:1fr}
      .photos img{height:190px}
    }

    /* Botones */
    .btnRow{display:flex;justify-content:center;gap:14px;margin-top:6px;flex-wrap:wrap}
    button{
      border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:18px;
      cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow:0 12px 26px rgba(0,0,0,.16);
      user-select:none;-webkit-tap-highlight-color:transparent;
    }
    #yesBtn{
      background:linear-gradient(135deg,#ff2f78,var(--yes));
      color:#fff;
      transform:scale(1);
    }
    #yesBtn:hover{transform:scale(1.04)}

    /* NO flotante */
    #noBtn{
      background:rgba(107,114,128,.15);
      color:#111827;
      border:1px solid rgba(107,114,128,.25);
      box-shadow:0 10px 22px rgba(0,0,0,.10);
      position:fixed;
      left:50%;
      top:calc(50% + 160px);
      transform:translate(-50%,-50%) scale(1);
      z-index:3;
    }

    /* Música */
    .musicBar{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;flex-wrap:wrap}
    .pill{
      background:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.7);
      border-radius:999px;
      padding:10px 14px;
      font-size:13px;
      opacity:.95;
    }
    .smallBtn{
      border-radius:999px;
      padding:10px 14px;
      font-size:14px;
      font-weight:800;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
      background:rgba(255,255,255,.85);
    }

    /* Modal final */
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.35);
      display:none;align-items:center;justify-content:center;z-index:10;padding:18px;
    }
    .modalContent{
      width:min(620px,92vw);
      background:#fff;border-radius:26px;padding:22px;text-align:center;
      box-shadow:0 24px 80px rgba(0,0,0,.25);
    }
    .modalContent h2{margin:0 0 10px;font-size:clamp(22px,4vw,32px)}
    .modalContent p{margin:0 0 14px;opacity:.85}

    /* ===== Pantalla del sobre (intro) ===== */
    .intro{
      position:fixed; inset:0;
      display:grid; place-items:center;
      z-index:20;
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.6) 0%, rgba(255,227,238,.9) 35%, rgba(255,208,226,.95) 100%);
      transition: opacity .45s ease, transform .45s ease;
    }
    .intro.hidden{
      opacity:0;
      pointer-events:none;
      transform: scale(1.02);
    }
    .envelopeWrap{
      width:min(520px, 92vw);
      text-align:center;
    }
    .introTitle{
      margin:0 0 14px;
      font-weight:900;
      font-size: clamp(18px, 3.6vw, 26px);
      opacity:.9;
    }
    .introHint{
      margin:14px 0 0;
      font-size:14px;
      opacity:.8;
    }

    .envelopeBtn{
      border:0;
      background:transparent;
      cursor:pointer;
      padding:0;
      width:100%;
      -webkit-tap-highlight-color:transparent;
      box-shadow:none;
    }
    .envelope{
      width:100%;
      aspect-ratio: 16/10;
      border-radius: 22px;
      position:relative;
      display:grid;
      place-items:center;
      box-shadow: 0 24px 70px rgba(0,0,0,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.7));
      border: 1px solid rgba(255,255,255,.7);
      overflow:hidden;
      transform: translateZ(0);
    }
    .envelope::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 30% 20%, rgba(255,77,141,.20), transparent 55%),
                  radial-gradient(circle at 80% 70%, rgba(255,47,120,.18), transparent 60%);
      pointer-events:none;
    }

    /* Solapa */
    .flap{
      position:absolute;
      top:-2px; left:-2px; right:-2px;
      height:58%;
      background: linear-gradient(180deg, rgba(255,230,242,1), rgba(255,210,230,1));
      clip-path: polygon(0 0, 100% 0, 50% 70%);
      transform-origin: top center;
      transition: transform .55s cubic-bezier(.2,.9,.2,1);
      border-bottom: 1px solid rgba(255,255,255,.6);
    }

    /* Cuerpo del sobre */
    .bodyEnv{
      position:absolute;
      inset:0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.65));
      clip-path: polygon(0 18%, 50% 52%, 100% 18%, 100% 100%, 0 100%);
      opacity:.95;
    }

    /* Carta dentro */
    .letter{
      position:absolute;
      width:86%;
      height:68%;
      bottom:10%;
      left:7%;
      background: rgba(255,255,255,.92);
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.75);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      text-align:center;
      transform: translateY(24px);
      transition: transform .55s cubic-bezier(.2,.9,.2,1), opacity .35s ease;
    }

    .letterText{
      font-weight:900;
      font-size: clamp(14px, 2.7vw, 18px);
      line-height:1.25;
    }
    .letterText span{
      display:block;
      margin-top:10px;
      font-weight:800;
      opacity:.85;
    }

    /* Efecto al abrir */
    .intro.open .flap{ transform: rotateX(180deg); }
    .intro.open .letter{ transform: translateY(-22px); }

    /* Contenido principal oculto hasta abrir */
    .mainContent{
      opacity:0;
      transform: translateY(10px) scale(.99);
      pointer-events:none;
      transition: opacity .45s ease, transform .45s ease;
    }
    .mainContent.show{
      opacity:1;
      transform: translateY(0) scale(1);
      pointer-events:auto;
    }
  </style>
</head>

<body>
  <div class="hearts" id="hearts"></div>

  <!-- ===== INTRO SOBRE ===== -->
  <div class="intro" id="intro">
    <div class="envelopeWrap">
      <div class="introTitle">💌 Tienes una carta…</div>

      <button class="envelopeBtn" id="openEnvelope" aria-label="Abrir sobre">
        <div class="envelope" role="img" aria-label="Sobre con carta">
          <div class="bodyEnv"></div>
          <div class="letter">
            <div class="letterText">
              Para la mujer más maravillosa del mundo,
              o sea tú <b>Ariadna</b> 💖
              <span>De parte de tu marido 💍</span>
            </div>
          </div>
          <div class="flap"></div>
        </div>
      </button>

      <div class="introHint">Toca el sobre para abrirlo ✨</div>
    </div>
  </div>

  <!-- ===== CONTENIDO PRINCIPAL ===== -->
  <div class="wrap mainContent" id="mainContent">
    <div class="card">
      <div class="pill">💗 Si no suena, toca “▶ Música” (el autoplay suele bloquearse)</div>
      <h1>¿Quieres ser mi San Valentín? 💘</h1>

      <div class="photos">
        <img src="foto1.jpeg" alt="Nosotros 1" />
        <img src="foto2.jpeg" alt="Nosotros 2" />
        <img src="foto3.jpeg" alt="Nosotros 3" />
      </div>

      <div class="btnRow">
        <button id="yesBtn">Sí 💞</button>
      </div>

      <div class="musicBar">
        <button class="smallBtn" id="musicBtn">▶ Música</button>
        <div class="pill"> Empieza en <b>0:18</b></div>
      </div>

      <audio id="audio" src="morat.mp3" preload="auto" loop></audio>
    </div>
  </div>

  <button id="noBtn" aria-label="No" style="display:none;">No 😼</button>

  <div class="modal" id="modal">
    <div class="modalContent">
      <h2>¡¡SÍÍÍ!! 🥰💘</h2>
      <p>Sabía que dirías que sí, Te amo My Love</p>
      <button id="closeBtn" class="smallBtn">Cerrar</button>
    </div>
  </div>

  <script>
    // ===== Corazones animados =====
    const hearts = document.getElementById("hearts");
    const heartEmojis = ["💗","💖","💘","💝","💞","💕"];

    function spawnHeart(){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = heartEmojis[Math.floor(Math.random()*heartEmojis.length)];

      const left = Math.random()*100; // vw
      const size = 14 + Math.random()*22;
      const duration = 6 + Math.random()*6;
      const drift = (Math.random()*2 - 1) * 80;

      h.style.left = left + "vw";
      h.style.fontSize = size + "px";
      h.style.animationDuration = duration + "s";
      h.style.setProperty("--drift", drift + "px");

      hearts.appendChild(h);
      setTimeout(()=>h.remove(), duration*1000);
    }
    setInterval(spawnHeart, 280);

    // ===== Música (Morat - Cómo te atreves) empezando en el mejor segundo =====
    const audio = document.getElementById("audio");
    const musicBtn = document.getElementById("musicBtn");
    let isPlaying = false;

    const BEST_START_SECOND = 18; // 0:18

    function setBestStart(){
      try { audio.currentTime = BEST_START_SECOND; } catch(e) {}
    }

    async function toggleMusic(){
      try{
        if(!isPlaying){
          setBestStart();
          audio.volume = 0.85;
          await audio.play();
          isPlaying = true;
          musicBtn.textContent = "⏸ Pausar";
        }else{
          audio.pause();
          isPlaying = false;
          musicBtn.textContent = "▶ Música";
        }
      }catch(e){
        alert("No se pudo reproducir la música. Revisa que 'morat.mp3' exista en la misma carpeta y vuelve a tocar el botón.");
      }
    }
    musicBtn.addEventListener("click", toggleMusic);

    // ===== Intro: abrir sobre y mostrar contenido =====
    const intro = document.getElementById("intro");
    const openEnvelope = document.getElementById("openEnvelope");
    const mainContent = document.getElementById("mainContent");
    const noBtn  = document.getElementById("noBtn");

    function showMain(){
      // muestra contenido
      mainContent.classList.add("show");
      // muestra botón NO (flotante)
      noBtn.style.display = "inline-block";
      // coloca el NO bien
      moveNoButton();
      // intento de autoplay al abrir (más probable que funcione porque hubo interacción)
      toggleMusic();
    }

    openEnvelope.addEventListener("click", ()=>{
      // animación de abrir
      intro.classList.add("open");
      // después ocultamos intro y mostramos todo
      setTimeout(()=>{
        intro.classList.add("hidden");
        showMain();
      }, 650);
    });

    // ===== Botones Sí / No =====
    const yesBtn = document.getElementById("yesBtn");
    const modal  = document.getElementById("modal");
    const closeBtn = document.getElementById("closeBtn");

    let noScale = 1;
    let yesScale = 1;

    function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }

    function moveNoButton(){
      const padding = 16;
      const rect = noBtn.getBoundingClientRect();

      const maxX = window.innerWidth  - rect.width  - padding;
      const maxY = window.innerHeight - rect.height - padding;

      const x = padding + Math.random() * clamp(maxX - padding, padding, maxX);
      const y = padding + Math.random() * clamp(maxY - padding, padding, maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
      noBtn.style.transform = `translate(0,0) scale(${noScale})`;
    }

    function updateScales(){
      noScale  = Math.max(0.06, noScale * 0.78);
      yesScale = Math.min(6.0,  yesScale * 1.18);

      yesBtn.style.transform = `scale(${yesScale})`;

      if(noScale <= 0.08){
        noBtn.style.opacity = "0";
        noBtn.style.pointerEvents = "none";
      }
    }

    noBtn.addEventListener("click", ()=>{
      updateScales();
      moveNoButton();
    });

    noBtn.addEventListener("mouseenter", ()=>{
      moveNoButton();
    });

    yesBtn.addEventListener("click", ()=>{
      if(!isPlaying){
        toggleMusic();
      }else{
        audio.volume = 1;
      }

      modal.style.display = "flex";
      for(let i=0;i<18;i++) setTimeout(spawnHeart, i*60);
    });

    closeBtn.addEventListener("click", ()=>{
      modal.style.display = "none";
    });

    // (Ya no intentamos autoplay al cargar, porque primero va el sobre)
    window.addEventListener("resize", ()=> {
      if (noBtn.style.display !== "none") moveNoButton();
    });
  </script>
</body>
</html>
